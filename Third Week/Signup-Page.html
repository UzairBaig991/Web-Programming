<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
</head>
<style>
    body {
        background-color: whitesmoke;
    }

    .form-container {
        width: 100%;
        max-width: 400px;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
    }
    h1 {
        color:rgb(90, 56, 22);
        margin-bottom: 8px;
        font-size: 28px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #333;
        font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.2s, box-shadow 0.2s; 
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus{
        outline: none;
        border-color: #4a90e2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .gender-group{
        display: flex;
        gap: 25px;
        margin-top: 6px;
    }

    .gender-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .gender-option input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #4a90e2;
            cursor: pointer;
        }

        .gender-option label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #357abd;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .footer-text a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
</style>
<body>
    <div class="form-container">
    <h1>Signup Here</h1>
    <hr>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username"><br>
    <label for="em">Email</label>
    <input type="email" id="em" name="em"><br>
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass"><br>
    <label for="cpass">Confirm Password</label>
    <input type="password" id="cpass" name="cpass"><br>
    <label>Gender</label>
    <div class="gender-group">
    <div class="gender-option">
    <input type="radio" id="male" name="name" value="Male">
    <label for="male">Male</label>
    </div>
    <div class="gender-option">
    <input type="radio" id="female" name="name" value="female">
    <label for="female">Female</label><br>
    </div>
    </div>
    <button type="submit">Submit</button>
    <hr>
    </div>
</body>
</html>
