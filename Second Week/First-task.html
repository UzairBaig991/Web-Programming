<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: solid 1px black;
            margin-left: 50px;
            padding: 20px;
            background-color: blue;
        }
        tr,th,td{
            border: solid 1px black;
            font-size: 15px;
            color: rgb(235, 5, 5);
            background-color: aqua;
            padding: 20px;
        }
        td:hover{
            background-color: gray;
            cursor: pointer;
        }
        th:hover{
            color: black;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body style="background-color: rgb(80, 172, 237)" >
    
    <h1>Lecture Week 2</h1>
    <h1>Tables in html</h1>
    <table style="border: dotted green 2px;">
        <tr>  
            <th>Name</th>    
            <th>Address</th>
            <th>Phone No</th>
        </tr>
        <tr>
            <td>Uzair</td>  
            <td>Multan</td>
            <td>03145487196</td>
        </tr>
        <tr>
            <td>Unaib</td>  
            <td>Rawalpindi</td>
            <td>03005223820</td>
        </tr>
    </table>
</body>
</html>
